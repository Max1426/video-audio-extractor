name: Build and publish Windows release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Run media smoke tests
        shell: powershell
        run: dotnet run --project .\tests\VideoAudioExtractor.SmokeTests\VideoAudioExtractor.SmokeTests.csproj -c Release

      - name: Build installer
        shell: powershell
        run: .\scripts\build.ps1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoAudioExtractor-v1.0.1-win-x64
          path: artifacts/installer/*.exe
          if-no-files-found: error

      - name: Create or update GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem -LiteralPath '.\artifacts\installer' -Filter '*.exe' | Select-Object -Single
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash
          @"
          ## 视频音轨提取软件 V1.0.1

          Windows 10/11 x64 自包含安装包，内置 FFmpeg，无需另外安装 .NET 或 FFmpeg。

          - 批量将视频完整音轨转换为 MP3
          - 支持 128 / 192 / 320 kbps
          - 支持进度显示、取消、无音轨检测与同名避让
          - SHA-256：``$hash``

          > 安装包尚未进行商业代码签名，Windows SmartScreen 可能提示“未知发布者”。
          "@ | Set-Content -LiteralPath '.\release-notes.md' -Encoding utf8

          if (gh release view 'v1.0.1' --repo '${{ github.repository }}' 2>$null) {
            gh release upload 'v1.0.1' $installer.FullName --clobber --repo '${{ github.repository }}'
            gh release edit 'v1.0.1' --notes-file '.\release-notes.md' --repo '${{ github.repository }}'
          } else {
            gh release create 'v1.0.1' $installer.FullName --target $env:GITHUB_SHA --title '视频音轨提取软件 V1.0.1' --notes-file '.\release-notes.md' --repo '${{ github.repository }}'
          }
